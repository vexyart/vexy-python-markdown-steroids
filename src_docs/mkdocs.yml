# this_file: src_docs/mkdocs.yml
site_name: vexy-python-markdown-steroids
site_description: Python-Markdown extensions for image paths and captions, keyboard keys, wiki links, Mako templates, YAML metadata and HTML clean-up
site_url: https://vexy.dev/vexy-python-markdown-steroids/
repo_url: https://github.com/vexyart/vexy-python-markdown-steroids
repo_name: vexyart/vexy-python-markdown-steroids
edit_uri: edit/master/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - search
extra_css:
  - style/custom.css
nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Extensions:
      - Overview: extensions/index.md
      - absimgsrc: extensions/absimgsrc.md
      - comments: extensions/comments.md
      - figcap: extensions/figcap.md
      - img_smart: extensions/img_smart.md
      - interlink: extensions/interlink.md
      - keys and kbd: extensions/keys.md
      - Key name reference: extensions/keys-reference.md
      - kill_tags: extensions/kill_tags.md
      - md_mako: extensions/md_mako.md
      - meta_yaml: extensions/meta_yaml.md
      - replimgsrc: extensions/replimgsrc.md
      - translate_no: extensions/translate_no.md
      - wikilink: extensions/wikilink.md
  - Development:
      - Architecture: development/architecture.md
      - Contributing: development/contributing.md
  - About:
      - License and credits: about/license.md
      - Changelog: about/changelog.md
# Rebuild the preview when the extension sources change (properdocs serve).
watch:
  - ../mdx_steroids
