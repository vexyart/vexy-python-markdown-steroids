# this_file: src_docs/mkdocs.yml
site_name: vexy-python-markdown-steroids
site_description: Python-Markdown extensions for image paths and captions, keyboard keys, wiki links, Mako templates, YAML metadata and HTML clean-up
site_url: https://vexy.dev/vexy-python-markdown-steroids/
repo_url: https://github.com/vexyart/vexy-python-markdown-steroids
repo_name: vexyart/vexy-python-markdown-steroids
edit_uri: edit/master/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - materialx/meta
  - materialx/tags
  - awesome-nav
  - materialx/search
extra_css:
  - style/custom.css
watch:
  - ../mdx_steroids
