# this_file: pyproject.toml

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vexy-python-markdown-steroids"
dynamic = ["version"]
description = "Small collection of Python Markdown extensions"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Adam Twardoch", email = "adam+github@twardoch.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["markdown", "extension", "plugin", "python-markdown"]
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.5",
    "mako>=1.3",
    "pymdown-extensions>=10.2",
    "cssselect>=1.2",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/vexyart/vexy-python-markdown-steroids"
Documentation = "https://github.com/vexyart/vexy-python-markdown-steroids"
Repository = "https://github.com/vexyart/vexy-python-markdown-steroids"
Issues = "https://github.com/vexyart/vexy-python-markdown-steroids/issues"
Changelog = "https://github.com/vexyart/vexy-python-markdown-steroids/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "mdx_steroids/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["mdx_steroids"]

[tool.hatch.build.targets.sdist]
include = [
    "/mdx_steroids",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["mdx_steroids"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
